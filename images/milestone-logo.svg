<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <!-- Milestone Distinct Emblem -->
  <g transform="translate(95, 8)">
    <!-- Outer Navy Square Frame -->
    <rect x="0" y="0" width="130" height="130" rx="3" fill="#0b244d" />
    <!-- White Inner Gap -->
    <rect x="10" y="10" width="110" height="110" fill="#ffffff" />
    
    <!-- Outer Navy Monogram Frame -->
    <path d="M20 20 H110 V110 H20 Z" fill="#0b244d" />
    
    <!-- White Cutouts to form Geometric 'M' with Green Center -->
    <rect x="30" y="30" width="70" height="70" fill="#ffffff" />
    
    <!-- Left Navy Pillar -->
    <rect x="36" y="30" width="18" height="70" fill="#0b244d" />
    
    <!-- Center Emerald Green Block -->
    <rect x="58" y="30" width="14" height="42" fill="#15803d" />
    
    <!-- Right Navy Pillar -->
    <rect x="76" y="30" width="18" height="70" fill="#0b244d" />
  </g>

  <!-- Brand Typography -->
  <!-- "MILESTONE" in bold authoritative navy -->
  <text x="160" y="174" text-anchor="middle" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#0b244d" letter-spacing="3">MILESTONE</text>
  
  <!-- "Financial Distribution Pvt. Ltd." -->
  <text x="160" y="202" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-weight="700" font-size="14" fill="#0b244d" letter-spacing="0.5">Financial Distribution Pvt. Ltd.</text>
</svg>
